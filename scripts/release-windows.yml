name: Windows NSIS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build schedule-engine
        working-directory: packages/schedule-engine
        run: npm ci
      - name: Compile schedule-engine
        working-directory: packages/schedule-engine
        run: npm run build
      - name: Install widget deps
        working-directory: apps/coolmessenger-widget-demo
        run: npm ci
      - name: Bundle embeddable CPython
        shell: pwsh
        run: ./scripts/prepare-windows-python.ps1
      - name: Build NSIS installer
        working-directory: apps/coolmessenger-widget-demo
        run: npx tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cool-lin-widget-nsis
          path: apps/coolmessenger-widget-demo/src-tauri/target/release/bundle/nsis/*.exe
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/coolmessenger-widget-demo/src-tauri/target/release/bundle/nsis/*.exe
