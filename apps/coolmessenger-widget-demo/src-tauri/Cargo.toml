[package]
name = "cool-lin-widget"
version = "0.1.0"
description = "교사 일정도우미 — 바탕화면 일정 위젯 (데모 셸)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
